name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # Coverage has a floor in pyproject.toml, so this fails if a change
      # deletes tests rather than fixing them.
      - name: Tests
        run: pytest --cov

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # The hosted site runs the TypeScript engine, not the Python one, so it
      # carries its own tests. The frame-size constants are pinned to the same
      # values on both sides: if either drifts, one of the two suites fails.
      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Static-host build
        run: npm run build:hosted

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # render.yaml deploys this image, so a broken Dockerfile is a broken
      # deployment. Build only -- nothing is pushed.
      - name: Build
        run: docker build -t v2x-ecosystem:ci .
